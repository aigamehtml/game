<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜数字小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 2.4rem 2rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 2px;
      padding: 0.3rem 1rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      margin-bottom: 1.2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.6rem;
      background: linear-gradient(90deg, #fff, #ffd369);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tip { color: #c9d1e0; font-size: 0.95rem; margin-bottom: 1.4rem; }
    .row { display: flex; gap: 0.6rem; justify-content: center; }
    input[type="number"] {
      width: 100%;
      max-width: 200px;
      padding: 0.7rem 1rem;
      font-size: 1.1rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(0,0,0,.25);
      color: #fff;
      outline: none;
    }
    input[type="number"]:focus { border-color: #ff6b6b; }
    .btn {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233,69,96,.5); }
    .btn.ghost { background: rgba(255,255,255,.1); }
    .msg {
      min-height: 1.6rem;
      margin: 1.2rem 0 0.6rem;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .msg.win { color: #6bffb0; }
    .msg.warn { color: #ffd369; }
    .msg.err { color: #ff8a8a; }
    .meta { color: #8fa0bd; font-size: 0.85rem; }
    .back { display: inline-block; margin-top: 1.4rem; color: #c9d1e0; text-decoration: none; font-size: 0.85rem; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">GAME</span>
    <h1>猜数字</h1>
    <p class="tip">我想了一个 1–100 之间的整数，猜猜看？</p>
    <div class="row">
      <input type="number" id="guess" min="1" max="100" placeholder="输入数字" autocomplete="off">
      <button class="btn" id="go">猜！</button>
    </div>
    <div class="msg" id="msg">已就绪，开始吧～</div>
    <div class="meta">已猜次数：<span id="count">0</span></div>
    <button class="btn ghost" id="restart" style="margin-top:1.2rem">重新开始</button>
    <br>
    <a class="back" href="games.html">&larr; 返回游戏列表</a>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let secret, count;

    function reset() {
      secret = Math.floor(Math.random() * 100) + 1;
      count = 0;
      $('count').textContent = '0';
      setMsg('已就绪，开始吧～', '');
      $('guess').value = '';
      $('guess').focus();
    }

    function setMsg(text, cls) {
      const m = $('msg');
      m.textContent = text;
      m.className = 'msg' + (cls ? ' ' + cls : '');
    }

    function guess() {
      const v = parseInt($('guess').value, 10);
      if (isNaN(v) || v < 1 || v > 100) {
        setMsg('请输入 1 到 100 之间的整数', 'err');
        return;
      }
      count++;
      $('count').textContent = count;
      if (v === secret) {
        setMsg('🎉 猜对了！答案就是 ' + secret + '，用了 ' + count + ' 次', 'win');
        $('guess').value = '';
        return;
      }
      setMsg(v < secret ? '太小了，再大一点 ↑' : '太大了，再小一点 ↓', 'warn');
      $('guess').value = '';
      $('guess').focus();
    }

    $('go').addEventListener('click', guess);
    $('restart').addEventListener('click', reset);
    $('guess').addEventListener('keydown', (e) => { if (e.key === 'Enter') guess(); });
    reset();
  </script>
</body>
</html>

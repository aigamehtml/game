<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的游戏网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      overflow-x: hidden;
      padding: 1.5rem;
    }
    .card {
      text-align: center;
      width: 100%;
      max-width: 640px;
      padding: 3rem 3.4rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .badge {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 2px;
      padding: 0.3rem 1rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2.6rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #fff, #ffd369);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .intro {
      color: #c9d1e0;
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.8rem 2.2rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(233, 69, 96, 0.5);
    }
    .links {
      margin-top: 2.4rem;
      padding-top: 1.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.92rem;
      color: #aab4c8;
      line-height: 1.9;
      text-align: left;
    }
    .links .label {
      color: #8fa0bd;
      font-size: 0.8rem;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 0.3rem;
    }
    .links a {
      color: #ffd369;
      text-decoration: none;
      border-bottom: 1px dashed rgba(255, 211, 105, 0.5);
      transition: color 0.2s, border-color 0.2s;
    }
    .links a:hover {
      color: #fff;
      border-bottom-color: #fff;
    }
    @media (max-width: 520px) {
      .card {
        padding: 2.2rem 1.4rem;
        animation: none;
      }
      h1 { font-size: 1.9rem; }
      .intro { font-size: 0.98rem; }
      .links { font-size: 0.86rem; margin-top: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">GAME ZONE</span>
    <h1>欢迎来到我的游戏网站</h1>
    <p class="intro">这里是我用 AI 开发的小游戏合集。挑一个，点开就能直接试玩，无需下载安装。</p>
    <a class="btn" href="games.html">进入游戏列表</a>

    <div class="links">
      <span class="label">想看源码 / 拿备份</span>
      访问 <a href="https://github.com/aigamehtml/game" target="_blank" rel="noopener">GitHub 仓库</a>
      或 <a href="https://pan.quark.cn/s/c0e77584800d" target="_blank" rel="noopener">夸克网盘</a>。<br>
      <span class="label">想了解开发过程</span>
      关注微信公众号 <a href="https://mp.weixin.qq.com/s/RVaZ5gvJdHcA42_R1DUESw" target="_blank" rel="noopener">边玩边赚日记</a>。
    </div>
  </div>
</body>
</html>

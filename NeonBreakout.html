<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>霓虹都市 · 打砖块</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0b0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            touch-action: none;
            padding: 0;
        }

        .game-wrapper {
            background: #13172b;
            padding: 12px 12px 16px 12px;
            border-radius: 28px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.15);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            padding-bottom: 16px;
            transition: padding-bottom 0.1s ease;
        }

        /* ===== 顶部信息栏 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 10px 6px;
            color: #b0e0ff;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(0, 200, 255, 0.4);
            font-size: 14px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .game-title {
            font-size: 18px;
            background: linear-gradient(90deg, #00d4ff, #a0f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .status-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-group span {
            background: rgba(0, 20, 40, 0.6);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            font-size: 13px;
            backdrop-filter: blur(2px);
        }

        .lives span {
            color: #ff5e7c;
            text-shadow: 0 0 20px #ff3b6f;
        }

        .restart-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: #8cd4ff;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
            -webkit-text-fill-color: #8cd4ff;
            touch-action: manipulation;
        }

        .restart-btn:active {
            background: rgba(0, 255, 255, 0.2);
        }

        /* ===== 全屏与提示行 ===== */
        .extra-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px 10px 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .fullscreen-btn {
            background: rgba(0, 200, 255, 0.15);
            border: 1px solid rgba(0, 255, 255, 0.25);
            color: #8cd4ff;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
            -webkit-text-fill-color: #8cd4ff;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .fullscreen-btn:active {
            background: rgba(0, 255, 255, 0.25);
        }

        .hint-text {
            font-size: 12px;
            color: rgba(180, 230, 255, 0.6);
            text-align: right;
            flex: 1;
            min-width: 100px;
            text-shadow: 0 0 8px rgba(0, 200, 255, 0.1);
        }

        /* ===== 返回链接 ===== */
        .back-link {
            text-align: center;
            padding: 12px 0 4px 0;
        }

        .back-link a {
            color: rgba(140, 212, 255, 0.7);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: 0.2s;
            -webkit-text-fill-color: rgba(140, 212, 255, 0.7);
            padding: 8px 16px;
            display: inline-block;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 255, 0.08);
        }

        .back-link a:active {
            background: rgba(0, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.25);
            color: #b0e0ff;
            -webkit-text-fill-color: #b0e0ff;
        }

        /* ===== 难度按钮 ===== */
        .difficulty-group {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px 0 10px 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .difficulty-group span {
            font-size: 13px;
            color: #8cd4ff;
            background: transparent;
            border: none;
            padding: 0 4px;
            -webkit-text-fill-color: #8cd4ff;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.15);
            color: #8cd4ff;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
            -webkit-text-fill-color: #8cd4ff;
            touch-action: manipulation;
            min-height: 40px;
        }

        .diff-btn:active {
            background: rgba(0, 255, 255, 0.15);
        }

        .diff-btn.active {
            background: rgba(0, 200, 255, 0.2);
            border-color: #00ffff;
            color: #ffffff;
            -webkit-text-fill-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.2);
        }

        /* ===== 画布（竖屏比例 9:16） ===== */
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: radial-gradient(circle at 20% 20%, #1a2340, #0a0d1a);
            box-shadow: inset 0 0 60px rgba(0, 150, 255, 0.08), 0 0 30px rgba(0, 200, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.2);
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16;
            touch-action: none;
            cursor: none;
        }

        /* ===== 弹窗 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 10, 25, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            touch-action: none;
            padding: 0;
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            background: #171f3a;
            padding: 40px 30px;
            border-radius: 50px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 80px rgba(0, 200, 255, 0.15);
            width: 85%;
            max-width: 360px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal h1 {
            font-size: 38px;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .modal .win-title {
            color: #00ffd0;
            text-shadow: 0 0 30px #00ffd0;
        }
        .modal .lose-title {
            color: #ff5577;
            text-shadow: 0 0 30px #ff3355;
        }
        .modal p {
            color: #b8d0ff;
            font-size: 20px;
            margin: 12px 0 24px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .modal .btn-play {
            background: #00d4ff;
            border: none;
            color: #0b0e1a;
            font-size: 22px;
            font-weight: 800;
            padding: 14px 40px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.2);
            touch-action: manipulation;
            width: 100%;
        }
        .modal .btn-play:active {
            transform: scale(0.95);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .game-wrapper {
                padding: 8px 8px 12px 8px;
                border-radius: 20px;
            }
            .header {
                font-size: 12px;
                padding: 0 4px 6px 4px;
            }
            .game-title {
                font-size: 15px;
            }
            .status-group span {
                font-size: 11px;
                padding: 3px 10px;
            }
            .restart-btn {
                font-size: 11px;
                padding: 3px 12px;
            }
            .diff-btn {
                font-size: 12px;
                padding: 4px 12px;
                min-height: 32px;
            }
            .difficulty-group {
                gap: 4px;
                padding: 4px 0 8px 0;
            }
            .extra-controls {
                padding: 4px 6px 8px 6px;
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .hint-text {
                text-align: center;
                font-size: 11px;
            }
            .fullscreen-btn {
                font-size: 13px;
                padding: 5px 12px;
                text-align: center;
            }
            .back-link {
                padding: 8px 0 2px 0;
            }
            .back-link a {
                font-size: 13px;
                padding: 6px 12px;
            }
            .modal {
                padding: 30px 20px;
            }
            .modal h1 {
                font-size: 30px;
            }
            .modal p {
                font-size: 18px;
            }
            .modal .btn-play {
                font-size: 18px;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="gameWrapper">
        <!-- 顶部信息栏 -->
        <div class="header">
            <div class="game-title">✦ 霓虹打砖块</div>
            <div class="status-group">
                <span class="score">🏆 <span id="scoreDisplay">0</span></span>
                <span class="lives">❤️ <span id="livesDisplay">3</span></span>
                <button class="restart-btn" id="restartButton">⟳</button>
            </div>
        </div>

        <!-- 难度选择 -->
        <div class="difficulty-group">
            <span>⚡</span>
            <button class="diff-btn" data-diff="easy">简单</button>
            <button class="diff-btn active" data-diff="normal">普通</button>
            <button class="diff-btn" data-diff="hard">困难</button>
        </div>

        <!-- 额外控制：全屏按钮 + 提示 -->
        <div class="extra-controls">
            <button class="fullscreen-btn" id="fullscreenBtn">⛶ 全屏</button>
            <span class="hint-text" id="hintText">💡 若底部被遮挡，请点击全屏</span>
        </div>

        <!-- 画布 -->
        <canvas id="gameCanvas" width="360" height="640"></canvas>

        <!-- 返回链接（已修改 href 为 games.html） -->
        <div class="back-link">
            <a class="back" href="games.html">&larr; 返回游戏列表</a>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h1 id="modalTitle">✨ 胜利</h1>
            <p id="modalMessage">得分: 0</p>
            <button class="btn-play" id="modalButton">▶ 再来一局</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  霓虹都市打砖块 – 全屏 + 提示 + 底部返回链接 (href=games.html)
        // ================================================================

        (function() {
            // -------- DOM 引用 --------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const livesSpan = document.getElementById('livesDisplay');
            const overlay = document.getElementById('overlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalBtn = document.getElementById('modalButton');
            const restartBtn = document.getElementById('restartButton');
            const diffBtns = document.querySelectorAll('.diff-btn');
            const wrapper = document.getElementById('gameWrapper');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const hintText = document.getElementById('hintText');

            // -------- 画布尺寸（竖屏） --------
            const W = 360;
            const H = 640;

            // -------- 游戏参数（挡板上移） --------
            const PADDLE_W = 100;
            const PADDLE_H = 14;
            const BALL_RADIUS = 8;
            const BRICK_ROWS = 6;
            const BRICK_COLS = 8;
            const BRICK_W = 36;
            const BRICK_H = 18;
            const BRICK_PAD = 4;
            const TOP_OFFSET = 50;
            const PADDLE_Y_OFFSET = 70;

            const ROW_COLORS = [
                { fill: '#ff3b6f', glow: '#ff1a5c' },
                { fill: '#ff7b3a', glow: '#ff5a1a' },
                { fill: '#ffd93d', glow: '#ffc800' },
                { fill: '#6bcb77', glow: '#3bb354' },
                { fill: '#4d96ff', glow: '#1a7aff' },
                { fill: '#9b59b6', glow: '#8e44ad' }
            ];

            // -------- 难度速度配置 --------
            let BALL_SPEED = 7;
            let PADDLE_SPEED = 10;

            // -------- 游戏状态 --------
            let gameState = 'playing';
            let score = 0;
            let lives = 3;

            let paddle = { x: 0, y: 0, w: PADDLE_W, h: PADDLE_H };
            let ball = {
                x: 0,
                y: 0,
                r: BALL_RADIUS,
                dx: 0,
                dy: 0,
                speed: BALL_SPEED
            };
            let bricks = [];
            let trail = [];
            let particles = [];

            let touchX = null;
            let keys = { left: false, right: false };
            window.__keys = keys;

            // -------- 全屏功能 --------
            function toggleFullscreen() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    const el = document.documentElement;
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(err => {
                            hintText.textContent = '⚠️ 全屏被拒绝，请手动调整浏览器';
                        });
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            }

            function updateFullscreenButton() {
                const isFull = !!document.fullscreenElement || !!document.webkitFullscreenElement;
                fullscreenBtn.textContent = isFull ? '⛶ 退出' : '⛶ 全屏';
            }
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

            // -------- 动态底部安全间距 --------
            function adjustBottomPadding() {
                if (!wrapper) return;
                let bottomOffset = 0;
                if (window.visualViewport) {
                    const vh = window.visualViewport.height;
                    const vTop = window.visualViewport.offsetTop || 0;
                    const winH = window.innerHeight;
                    const diff = winH - (vh + vTop);
                    if (diff > 0) {
                        bottomOffset = diff;
                    }
                }
                if (bottomOffset === 0) {
                    const clientH = document.documentElement.clientHeight;
                    const winH = window.innerHeight;
                    const diff2 = winH - clientH;
                    if (diff2 > 0) {
                        bottomOffset = diff2;
                    }
                }
                const padding = Math.max(16, bottomOffset + 10);
                wrapper.style.paddingBottom = padding + 'px';
                if (bottomOffset > 30) {
                    hintText.textContent = '📱 检测到底部遮挡，建议点击全屏';
                } else {
                    hintText.textContent = '💡 若底部被遮挡，请点击全屏';
                }
            }

            // -------- 初始化砖块 --------
            function initBricks() {
                bricks = [];
                const totalWidth = BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD;
                const startX = (W - totalWidth) / 2;
                for (let row = 0; row < BRICK_ROWS; row++) {
                    for (let col = 0; col < BRICK_COLS; col++) {
                        const x = startX + col * (BRICK_W + BRICK_PAD);
                        const y = TOP_OFFSET + row * (BRICK_H + BRICK_PAD);
                        const color = ROW_COLORS[row % ROW_COLORS.length];
                        bricks.push({
                            x,
                            y,
                            w: BRICK_W,
                            h: BRICK_H,
                            alive: true,
                            color: color,
                            row: row
                        });
                    }
                }
            }

            // -------- 重置球和挡板 --------
            function resetBallAndPaddle() {
                paddle.x = (W - PADDLE_W) / 2;
                paddle.y = H - PADDLE_Y_OFFSET;

                ball.x = W / 2;
                ball.y = H - PADDLE_Y_OFFSET - 40;
                const angle = (Math.random() * 2 - 1) * Math.PI / 3;
                const speed = ball.speed;
                ball.dx = Math.sin(angle) * speed;
                ball.dy = -Math.cos(angle) * speed;
                if (Math.abs(ball.dx) < 1.0) {
                    ball.dx = (ball.dx > 0 ? 1 : -1) * 1.5;
                }
                trail = [];
                particles = [];
            }

            // -------- 重置游戏 --------
            function resetGame() {
                score = 0;
                lives = 3;
                updateUI();
                initBricks();
                resetBallAndPaddle();
                gameState = 'playing';
                overlay.classList.remove('active');
                particles = [];
                trail = [];
            }

            // -------- UI 更新 --------
            function updateUI() {
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
            }

            // -------- 粒子系统 --------
            function spawnParticles(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3 + 1.5;
                    const size = Math.random() * 4 + 2;
                    particles.push({
                        x,
                        y,
                        dx: Math.cos(angle) * speed,
                        dy: Math.sin(angle) * speed - 0.5,
                        life: 1.0,
                        decay: 0.018 + Math.random() * 0.025,
                        size,
                        color
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.dx;
                    p.y += p.dy;
                    p.dy += 0.06;
                    p.life -= p.decay;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                if (particles.length > 120) particles.splice(0, particles.length - 120);
            }

            // -------- 碰撞检测 --------
            function rectCircleCollision(rx, ry, rw, rh, cx, cy, cr) {
                const nearX = Math.max(rx, Math.min(cx, rx + rw));
                const nearY = Math.max(ry, Math.min(cy, ry + rh));
                const dx = cx - nearX;
                const dy = cy - nearY;
                return (dx * dx + dy * dy) < (cr * cr);
            }

            // -------- 游戏更新 --------
            function updateGame() {
                if (gameState !== 'playing') return;

                if (touchX !== null) {
                    let newX = touchX - paddle.w / 2;
                    newX = Math.max(0, Math.min(W - paddle.w, newX));
                    paddle.x = newX;
                } else {
                    if (keys.left && paddle.x > 0) paddle.x -= PADDLE_SPEED;
                    if (keys.right && paddle.x + paddle.w < W) paddle.x += PADDLE_SPEED;
                }

                ball.x += ball.dx;
                ball.y += ball.dy;
                trail.push({ x: ball.x, y: ball.y });
                if (trail.length > 8) trail.shift();

                if (ball.x - ball.r < 0) { ball.x = ball.r;
                    ball.dx = -ball.dx; }
                if (ball.x + ball.r > W) { ball.x = W - ball.r;
                    ball.dx = -ball.dx; }
                if (ball.y - ball.r < 0) { ball.y = ball.r;
                    ball.dy = -ball.dy; }

                if (ball.y + ball.r > H) {
                    lives--;
                    updateUI();
                    if (lives <= 0) {
                        gameState = 'lose';
                        showModal(false);
                        return;
                    } else {
                        resetBallAndPaddle();
                        trail = [];
                        particles = [];
                        ball.y = paddle.y - ball.r - 10;
                        return;
                    }
                }

                if (ball.dy > 0 &&
                    ball.y + ball.r >= paddle.y &&
                    ball.y + ball.r <= paddle.y + paddle.h + 6 &&
                    ball.x >= paddle.x - ball.r &&
                    ball.x <= paddle.x + paddle.w + ball.r) {

                    const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                    const angle = hitPos * Math.PI / 3.2;
                    const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                    ball.dx = Math.sin(angle) * speed;
                    ball.dy = -Math.cos(angle) * speed;
                    ball.y = paddle.y - ball.r;
                }

                for (let i = 0; i < bricks.length; i++) {
                    const b = bricks[i];
                    if (!b.alive) continue;
                    if (rectCircleCollision(b.x, b.y, b.w, b.h, ball.x, ball.y, ball.r)) {
                        b.alive = false;
                        score += 10 + b.row;
                        updateUI();
                        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color.fill);

                        const overlapX = (ball.x < b.x + b.w / 2) ? (ball.x - b.x) : (ball.x - (b.x + b.w));
                        const overlapY = (ball.y < b.y + b.h / 2) ? (ball.y - b.y) : (ball.y - (b.y + b.h));
                        if (Math.abs(overlapX / (b.w / 2)) > Math.abs(overlapY / (b.h / 2))) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }
                        ball.x += ball.dx * 1.5;
                        ball.y += ball.dy * 1.5;

                        if (bricks.every(brick => !brick.alive)) {
                            gameState = 'win';
                            showModal(true);
                            return;
                        }
                        break;
                    }
                }

                const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                const targetSpeed = ball.speed;
                if (currentSpeed > targetSpeed * 1.2) {
                    ball.dx = (ball.dx / currentSpeed) * targetSpeed * 1.2;
                    ball.dy = (ball.dy / currentSpeed) * targetSpeed * 1.2;
                } else if (currentSpeed < targetSpeed * 0.8 && currentSpeed > 0.1) {
                    ball.dx = (ball.dx / currentSpeed) * targetSpeed * 0.8;
                    ball.dy = (ball.dy / currentSpeed) * targetSpeed * 0.8;
                }

                updateParticles();
            }

            // -------- 绘图 --------
            function draw() {
                ctx.clearRect(0, 0, W, H);

                ctx.strokeStyle = 'rgba(0,200,255,0.04)';
                ctx.lineWidth = 1;
                for (let i = 0; i < W; i += 30) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, H);
                    ctx.stroke();
                }
                for (let i = 0; i < H; i += 30) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(W, i);
                    ctx.stroke();
                }

                for (const b of bricks) {
                    if (!b.alive) continue;
                    const color = b.color;
                    ctx.shadowColor = color.glow;
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = color.fill;
                    const r = 4,
                        x = b.x,
                        y = b.y,
                        w = b.w,
                        h = b.h;
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.fillRect(x + 3, y + 2, w - 6, 4);
                }

                for (let i = 0; i < trail.length; i++) {
                    const p = trail[i];
                    const alpha = (i / trail.length) * 0.5;
                    const size = (i / trail.length) * ball.r * 0.7 + 1.5;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 255, ${alpha})`;
                    ctx.fill();
                }

                for (const p of particles) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 30;
                const grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 2, ball.x, ball.y, ball.r + 3);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#b0f0ff');
                grad.addColorStop(1, '#0088ff');
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(ball.x - 2, ball.y - 3, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();

                ctx.shadowColor = '#00ddff';
                ctx.shadowBlur = 25;
                const pGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
                pGrad.addColorStop(0, '#a0f0ff');
                pGrad.addColorStop(0.5, '#00ccff');
                pGrad.addColorStop(1, '#0077aa');
                ctx.fillStyle = pGrad;
                const pr = 8,
                    px = paddle.x,
                    py = paddle.y,
                    pw = paddle.w,
                    ph = paddle.h;
                ctx.beginPath();
                ctx.moveTo(px + pr, py);
                ctx.lineTo(px + pw - pr, py);
                ctx.quadraticCurveTo(px + pw, py, px + pw, py + pr);
                ctx.lineTo(px + pw, py + ph - pr);
                ctx.quadraticCurveTo(px + pw, py + ph, px + pw - pr, py + ph);
                ctx.lineTo(px + pr, py + ph);
                ctx.quadraticCurveTo(px, py + ph, px, py + ph - pr);
                ctx.lineTo(px, py + pr);
                ctx.quadraticCurveTo(px, py, px + pr, py);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(paddle.x + 10, paddle.y + 3, paddle.w - 20, 4);

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(180,230,255,0.25)';
                ctx.font = '10px monospace';
                ctx.fillText('← 滑动 →', 10, 22);
            }

            // -------- 弹窗 --------
            function showModal(win) {
                overlay.classList.add('active');
                if (win) {
                    modalTitle.textContent = '✨ 都市之光 ✨';
                    modalTitle.className = 'win-title';
                    modalMessage.textContent = `🎯 得分: ${score}`;
                    modalBtn.textContent = '▶ 再来一局';
                } else {
                    modalTitle.textContent = '💔 信号丢失';
                    modalTitle.className = 'lose-title';
                    modalMessage.textContent = `🏁 最终得分: ${score}`;
                    modalBtn.textContent = '⟳ 重新连接';
                }
            }

            // -------- 难度切换 --------
            function setDifficulty(level) {
                switch (level) {
                    case 'easy':
                        BALL_SPEED = 5.5;
                        PADDLE_SPEED = 8;
                        break;
                    case 'normal':
                        BALL_SPEED = 7;
                        PADDLE_SPEED = 10;
                        break;
                    case 'hard':
                        BALL_SPEED = 9;
                        PADDLE_SPEED = 13;
                        break;
                    default:
                        return;
                }
                ball.speed = BALL_SPEED;
                resetGame();
                diffBtns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.diff === level) btn.classList.add('active');
                });
            }

            // -------- 事件绑定 --------
            function setupEvents() {
                fullscreenBtn.addEventListener('click', toggleFullscreen);

                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const touch = e.touches[0];
                    if (touch) {
                        const canvasX = (touch.clientX - rect.left) * scaleX;
                        touchX = Math.max(0, Math.min(W, canvasX));
                    }
                }, { passive: false });

                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const touch = e.touches[0];
                    if (touch) {
                        const canvasX = (touch.clientX - rect.left) * scaleX;
                        touchX = Math.max(0, Math.min(W, canvasX));
                    }
                }, { passive: false });

                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    touchX = null;
                }, { passive: false });

                canvas.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    touchX = null;
                }, { passive: false });

                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const mouseX = (e.clientX - rect.left) * scaleX;
                    if (gameState === 'playing') {
                        touchX = Math.max(0, Math.min(W, mouseX));
                    }
                });

                canvas.addEventListener('mouseleave', () => {
                    touchX = null;
                });

                window.addEventListener('keydown', (e) => {
                    const key = e.key;
                    if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
                        keys.left = true;
                        e.preventDefault();
                    } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
                        keys.right = true;
                        e.preventDefault();
                    }
                    if (key === ' ' || key === 'Space') {
                        if (gameState === 'win' || gameState === 'lose') {
                            resetGame();
                            e.preventDefault();
                        }
                    }
                });
                window.addEventListener('keyup', (e) => {
                    const key = e.key;
                    if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
                        keys.left = false;
                        e.preventDefault();
                    } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
                        keys.right = false;
                        e.preventDefault();
                    }
                });

                restartBtn.addEventListener('click', resetGame);
                modalBtn.addEventListener('click', resetGame);

                diffBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        setDifficulty(btn.dataset.diff);
                    });
                });

                document.addEventListener('touchmove', (e) => {
                    if (e.target === canvas) e.preventDefault();
                }, { passive: false });

                window.addEventListener('resize', adjustBottomPadding);
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', adjustBottomPadding);
                }
            }

            // -------- 启动 --------
            function init() {
                adjustBottomPadding();
                setDifficulty('normal');
                setupEvents();
                function loop() {
                    updateGame();
                    draw();
                    requestAnimationFrame(loop);
                }
                loop();
            }

            init();
        })();
    </script>
</body>
</html>
